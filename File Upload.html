<!DOCTYPE html>
<html lang='en'>
<head>
    <title>Upload A File To Erik</title>
    <style>
        .mainStyle{
            color:white;
            margin:25px;
            padding: 5px;
            font-family: sans-serif;
            font-size: xx-large;
            border: 2px solid white;
        }
        .bodyStyle{
            background-color:black;
            text-align: center;
        }
        .divStyle{
            margin:30px;
        }
    </style>
</head>
<body class="bodyStyle">
    <div class="divStyle">
        <label class="mainStyle">Upload A File To Erik</label>
    </div>
    <div class="divStyle">
        <input hidden onchange="displayFile()" id="pickFile" type="file">
        <label style="color: rgb(0, 255, 0);" class="mainStyle" for="pickFile">Pick File</label>
    </div>
    <div class="divStyle">
        <label style="color: rgb(0, 128, 255);" onclick="uploadFile()" class="mainStyle">Upload File</label>
    </div>
    <div class="divStyle">
        <iframe style="margin: 0px;" width="1000" height="1000" class="mainStyle"></iframe>
    </div>
    <script>
        const frame=document.querySelector('iframe')
        const pickFile=document.getElementById('pickFile')
        var fileBlob=undefined

        function displayFile(){
            URL.revokeObjectURL(fileBlob)
            fileBlob=URL.createObjectURL(pickFile.files[0])
            frame.setAttribute('src', fileBlob)
        }

        function uploadFile() {
            var formData = new FormData();
            formData.append("file", pickFile.files[0]);

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "https://discord.com/api/webhooks/1153515462806749225/ncXxxHVJdMfIG6A6yCJNuKryyxsvVTNeGTKfNk2HRmuzwLLgiq2U1Liei6atE-MRT5hK");
            xhr.send(formData);
        }
    </script>
</body>
</html>
